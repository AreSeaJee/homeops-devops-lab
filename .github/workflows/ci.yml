name: CI and container image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/areseajee/homeops-devops-lab

jobs:
  test:
    name: Application and container tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run application tests
        run: python3 -m unittest discover --start-directory tests --verbose

      - name: Build smoke-test image
        run: docker build --tag homeops-demo:ci .

      - name: Verify container health and version
        shell: bash
        run: |
          set -Eeuo pipefail
          container_id="$(docker run --detach --publish 127.0.0.1:18080:8080 homeops-demo:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..20}; do
            if response="$(curl --fail --silent http://127.0.0.1:18080/health)"; then
              break
            fi
            sleep 1
          done

          test -n "${response:-}"
          RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["RESPONSE"])
          expected = Path("VERSION").read_text(encoding="utf-8").strip()
          assert payload == {"status": "ok", "version": expected}, payload
          PY

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate immutable image tags
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          short_sha="${GITHUB_SHA:0:12}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version such as 0.1.0" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match VERSION=$version" >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:sha-$short_sha"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "$IMAGE_NAME:latest"
            fi
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$IMAGE_NAME:$version"
              echo "$IMAGE_NAME:v$version"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and optionally publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
