services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${LAN_IP}:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
    name: homeops-proxy
