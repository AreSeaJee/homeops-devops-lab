services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${LAN_IP}:80:80"
      - "${LAN_IP}:443:443"
      - "${LAN_IP}:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy: {}
      nextcloud-aio:
        aliases:
          - cloud.home.arpa

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
    name: homeops-proxy
  nextcloud-aio:
    external: true
    name: nextcloud-aio
