services:
  portainer:
    image: portainer/portainer-ce:lts
    command:
      - --trusted-origins
      - http://portainer.home.arpa
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - proxy

volumes:
  portainer_data:

networks:
  proxy:
    external: true
    name: homeops-proxy
