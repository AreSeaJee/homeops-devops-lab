services:
  homeops-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: homeops-demo:local
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
